<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "en" }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .Title }} - {{ .Site.Title }}</title>
    {{ with .Site.Params.description }}<meta name="description" content="{{ . }}">{{ end }}
    <link rel="canonical" href="{{ .Permalink }}">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ .Site.Title }}">
    <meta property="og:title" content="{{ .Title }}">
    {{ with .Site.Params.description }}<meta property="og:description" content="{{ . }}">{{ end }}
    <meta property="og:url" content="{{ .Permalink }}">
    <meta property="og:image" content="{{ "images/logo.png" | absURL }}">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{ .Title }}">
    {{ with .Site.Params.description }}<meta name="twitter:description" content="{{ . }}">{{ end }}
    <meta name="twitter:image" content="{{ "images/logo.png" | absURL }}">

    <link rel="stylesheet" href="{{ "css/theme.css" | relURL }}">
</head>
<body>
<div class="ren-container">
    {{ partial "header.html" . }}
    {{ partial "breadcrumbs.html" . }}

    <main id="content">
        {{ block "content" . }}{{ end }}
    </main>

    {{ partial "footer.html" . }}
</div>
</body>
</html>
